<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - WarDog Store</title>
</head>
<body style="font-family: 'Arial', sans-serif; background-color: #08111e; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background-color: #0c2340; border: 1px solid #1c3d66; padding: 40px; border-radius: 4px; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
        <h1 style="margin-top: 0; font-size: 24px; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; text-align: center;">
            <span style="color: #e5a823;">WARDOG</span> STORE
        </h1>
        <p style="text-align: center; color: #a2b7d0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px;">Iniciar Sesión</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="background-color: #3d0c0c; border: 1px solid #ff5252; color: #ff5252; padding: 10px; font-size: 13px; margin-bottom: 15px; border-radius: 2px;">
            {% for message in messages %}
              <div>{{ message }}</div>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <label style="display: block; margin-bottom: 5px; font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">Correo Electrónico:</label>
            <input type="email" name="email" style="width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 15px; background-color: #061527; border: 1px solid #1c3d66; color: #ffffff; border-radius: 2px;" required><br>

            <label style="display: block; margin-bottom: 5px; font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">Contraseña:</label>
            <input type="password" name="password" style="width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 25px; background-color: #061527; border: 1px solid #1c3d66; color: #ffffff; border-radius: 2px;" required><br>

            <button type="submit" style="width: 100%; background-color: #e5a823; color: #0c2340; border: none; padding: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 2px;">
                Ingresar
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 13px; color: #a2b7d0;">
            ¿No tienes cuenta? <a href="/registro" style="color: #e5a823; text-decoration: none; font-weight: bold;">Regístrate aquí</a>
        </p>
    </div>

</body>
</html>
